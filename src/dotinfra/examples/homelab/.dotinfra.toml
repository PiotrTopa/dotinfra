# dotinfra configuration for the fictional "homelab" example CMDB, shared by every device.
# Try it:  dotinfra --root examples/homelab ls
# Machine-specific settings live in .dotinfra.local.toml (untracked); see
# .dotinfra.local.toml.example for what the monitoring host (nas) keeps there.

[cmdb]
name = "homelab"
schema = 2                       # CMDB layout version; `dotinfra migrate` updates it
min_version = "0.2.0"            # oldest dotinfra allowed to write here (set by migrate)

[vault]
backend = "file"
path = "~/.config/dotinfra/vault.json"
age_file = "vault.age"
age_identity = "~/.config/dotinfra/age.key"
age_recipients = []              # public keys of every device (vault identity / migrate add this one's)

[sync]
remote = "origin"
remote_url = "git@git.example.com:alice/homelab-infra.git"   # clone URL shown in README.md
peers = []
auto_commit = true
branch = "main"

[monitoring]
service = "monitoring"           # services/monitoring.md: runs_on nas, url + prometheus_url
grafana_user = "admin"
grafana_password_key = "grafana_password"
bundle_dir = "~/dotinfra-monitoring"

[events]
backend = "file"                 # the example ships its event log in events/2026.md;
                                 # "auto" would pick Grafana here (the monitoring service exists)

[lint]
max_lines = 120                  # warn when a component body is longer (docs are fact sheets)
