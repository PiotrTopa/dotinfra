# dotinfra configuration, shared by every device — see
# https://github.com/PiotrTopa/dotinfra/blob/main/docs/spec.md
# Machine-specific overrides (device name, vault paths, monitoring role, URLs
# reached over a VPN) go in .dotinfra.local.toml next to this file (untracked).

[cmdb]
name = "{{name}}"                # shown in INDEX.md and dashboards
schema = {{schema}}                       # CMDB layout version; `dotinfra migrate` updates it
min_version = "{{min_version}}"          # oldest dotinfra allowed to write here (set by migrate)

[vault]
backend = "file"                 # "file" | "age"
path = "~/.config/dotinfra/vault.json"   # file backend: plaintext JSON, mode 0600, outside the CMDB
age_file = "vault.age"           # age backend: encrypted file inside the CMDB (syncs with it)
age_identity = "~/.config/dotinfra/age.key"
age_recipients = []              # public keys of every device (vault identity / migrate add this one's)

[sync]
remote = "origin"                # hub remote; "" = peers only
remote_url = "{{remote_url}}"    # clone URL shown in README.md ("" = not known yet)
peers = []                       # other devices' remotes (dotinfra peer add NAME URL)
auto_commit = true
branch = "main"

[monitoring]
service = "monitoring"           # component id of the monitoring service (runs_on = its host)
# grafana_url / prometheus_url: only to override what is derived from that component
grafana_user = "admin"
grafana_password_key = "grafana_password"   # vault key, not the password
bundle_dir = "~/dotinfra-monitoring"

[events]
backend = "auto"                 # "auto" | "grafana" | "file" (events/<YYYY>.md in the CMDB)

[lint]
max_lines = 120                  # warn when a component body is longer (docs are fact sheets)
